apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: cluster-dev
nodes:
  - role: control-plane
  - role: worker
    labels:
      disk-type: ssd
      gpu: "false"
  - role: worker
    labels:
      disk-type: hdd
      gpu: "true"
      gpu-model: "nvidia-geforce-rtx-3090"
  - role: worker
    labels:
      disk-type: ssd
      gpu: "true"
      gpu-model: "nvidia-tesla-a100"